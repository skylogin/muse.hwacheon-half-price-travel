<script>
(function(){
"use strict";
var D = window.HWCHEON;
var CATS = { food:['🍚','음식점','#fb923c'], mart:['🛒','마트·편의점','#3b82f6'], cafe:['☕','카페·디저트','#a16207'], car:['🚗','주유·정비','#64748b'], etc:['📦','기타','#9ca3af'] };
var TOWNS = ['화천읍','사내면','상서면','간동면','하남면'];
var state = { cat:'all', town:'all', q:'', near:false };

function havKm(a,b,c,d){ var R=6371, r=function(x){return x*Math.PI/180;};
  var h=Math.sin(r(c-a)/2)*Math.sin(r(c-a)/2)+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)*Math.sin(r(d-b)/2);
  return 2*R*Math.asin(Math.sqrt(h)); }
var P = D.meta.pension;
function distP(s){ return havKm(P.lat, P.lon, s.la, s.lo); }
function filtered(){
  var q = state.q.trim();
  return D.stores.filter(function(s){
    if(state.cat!=='all' && s.c!==state.cat) return false;
    if(state.town!=='all' && s.t!==state.town) return false;
    if(q && s.n.indexOf(q)<0) return false;
    if(state.near && distP(s) > 5) return false;
    return true;
  });
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function kakaoMapLink(name, la, lo){ return 'https://map.kakao.com/link/map/' + encodeURIComponent(name) + ',' + la + ',' + lo; }
function kakaoRouteLink(s){ return 'https://map.kakao.com/link/to/' + encodeURIComponent(s.n) + ',' + s.la + ',' + s.lo; }
function naverSearch(name){ return 'https://map.naver.com/p/search/' + encodeURIComponent(name); }
function copyAddr(a){
  function done(){ alert('주소가 복사되었습니다'); }
  function fallback(){
    var ta=document.createElement('textarea'); ta.value=a; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ alert(a); }
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(a).then(done).catch(fallback); }
  else fallback();
}

// ---------- map ----------
if (typeof kakao === 'undefined' || !kakao.maps) {
  document.getElementById('map').innerHTML =
    '<div style="padding:48px 24px;text-align:center;color:#6b7280;font-size:14px;line-height:1.8">' +
    '지도를 불러오지 못했습니다.<br><br>' +
    '카카오 개발자 콘솔에서<br>① 제품 설정 → <b>카카오맵</b> 활성화<br>' +
    '② 앱 설정 → 플랫폼 → Web → <b>사이트 도메인</b>에<br>이 페이지 주소를 등록했는지 확인해주세요.</div>';
  return;
}
var map = new kakao.maps.Map(document.getElementById('map'), {
  center: new kakao.maps.LatLng(38.14, 127.62), level: 10
});
map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
map.setMinLevel(1); map.setMaxLevel(12);

var IMGS = {};
Object.keys(CATS).forEach(function(k){
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26"><circle cx="13" cy="13" r="10" fill="'+CATS[k][2]+'" stroke="white" stroke-width="3"/></svg>';
  IMGS[k] = new kakao.maps.MarkerImage(
    'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg),
    new kakao.maps.Size(26,26), { offset: new kakao.maps.Point(13,13) });
});

// landmarks
[
  { e:'🏠', o:P, note:'숙소 · 위치는 도로 기준 추정치' },
  { e:'🔭', o:D.meta.observatory, note:'이용시간 '+D.meta.observatory.hours },
  { e:'🌊', o:D.meta.dam, note:'2일차 주요 관광지' }
].forEach(function(lm){
  var pos = new kakao.maps.LatLng(lm.o.lat, lm.o.lon);
  var div = document.createElement('div');
  div.className = 'lm-wrap';
  div.innerHTML = '<div class="lm-emoji">'+lm.e+'</div><div class="lm-name">'+esc(lm.o.name)+'</div>';
  new kakao.maps.CustomOverlay({ position: pos, content: div, yAnchor: 1, zIndex: 10 }).setMap(map);
  div.addEventListener('click', function(){
    document.getElementById('sheetBody').innerHTML =
      '<h3>'+lm.e+' '+esc(lm.o.name)+'</h3>'+
      '<div class="addr">'+esc(lm.o.addr||'')+'</div>'+
      '<div class="row"><span class="badge etc">랜드마크</span><span class="dist">'+esc(lm.note)+'</span></div>'+
      '<div class="btns">'+
      '<a class="btn-kakao" href="'+kakaoMapLink(lm.o.name, lm.o.lat, lm.o.lon)+'" target="_blank" rel="noopener">카카오지도로 보기</a>'+
      '<a class="btn-naver" href="'+naverSearch(lm.o.name)+'" target="_blank" rel="noopener">네이버지도로 보기</a></div>';
    document.getElementById('sheet').classList.add('open');
  });
});

var markers = [];
function renderMarkers(){
  for(var i=0;i<markers.length;i++) markers[i].setMap(null);
  markers = [];
  var bounds = map.getBounds();
  var list = filtered();
  var shown = 0;
  for(var j=0;j<list.length && shown<500;j++){
    var s = list[j];
    var pos = new kakao.maps.LatLng(s.la, s.lo);
    if(!bounds.contain(pos)) continue;
    (function(st){
      var mk = new kakao.maps.Marker({ position: pos, image: IMGS[st.c], title: st.n });
      kakao.maps.event.addListener(mk, 'click', function(){ openSheet(st); });
      mk.setMap(map);
      markers.push(mk); shown++;
    })(s);
  }
  document.getElementById('subTitle').textContent =
    '소비인정업소 '+D.meta.count+'곳 중 '+list.length+'곳 · 화면에 '+shown+'곳 표시 · '+D.meta.updated+' 수집';
}
kakao.maps.event.addListener(map, 'idle', renderMarkers);

// fit all
(function(){
  var b = new kakao.maps.LatLngBounds();
  D.stores.forEach(function(s){ b.extend(new kakao.maps.LatLng(s.la, s.lo)); });
  b.extend(new kakao.maps.LatLng(P.lat, P.lon));
  b.extend(new kakao.maps.LatLng(D.meta.dam.lat, D.meta.dam.lon));
  map.setBounds(b);
})();

// my location
var meMk = null;
document.getElementById('locBtn').addEventListener('click', function(){
  if(!navigator.geolocation) return alert('위치 기능을 지원하지 않습니다');
  navigator.geolocation.getCurrentPosition(function(pos){
    var ll = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
    if(meMk) meMk.setMap(null);
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"><circle cx="11" cy="11" r="8" fill="#0f5132" stroke="white" stroke-width="3"/></svg>';
    meMk = new kakao.maps.Marker({ position: ll,
      image: new kakao.maps.MarkerImage('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg), new kakao.maps.Size(22,22)) });
    meMk.setMap(map);
    map.panTo(ll);
  }, function(){ alert('위치를 가져올 수 없습니다'); });
});

// ---------- sheet ----------
function openSheet(s){
  var d = distP(s);
  var acc = s.ac==='exact' ? '' : '<span class="approx">📍 대략 위치('+(s.ac==='road'?'도로':'읍면')+' 기준)</span>';

    '<h3>'+CATS[s.c][0]+' '+esc(s.n)+'</h3>'+

    '<div class="row"><span class="badge '+s.c+'">'+CATS[s.c][1]+'</span><span class="badge etc">'+esc(s.t)+'</span>'+
    '<span class="dist">숙소에서 약 '+d.toFixed(1)+'km</span>'+acc+'</div>'+
    '<div class="btns">'+
    '<a class="btn-kakao" href="'+kakaoMapLink(s.n+' '+s.t, s.la, s.lo)+'">카카오지도로 보기</a>'+
    '<a class="btn-naver" href="'+kakaoRouteLink(s)+'">🚗 길찾기</a></div>'+
    '<div style="margin-top:8px;font-size:12px;color:#6b7280">길찾기 버튼은 카카오지도로 연결됩니다. (인터넷 필요)</div>';
  document.getElementById('cpbtn').addEventListener('click', function(){ copyAddr('강원특별자치도 화천군 '+s.t); });

        if(!s) return;
        switchTab('map');
        map.panTo(new kakao.maps.LatLng(s.la, s.lo));
        map.setLevel(4);
        openSheet(s);
      });
    })(items[i]);
  }
}

// ---------- chips & tabs ----------
function buildChips(){
  var cc = document.getElementById('catChips');
  cc.innerHTML = '<button class="chip active" data-v="all">전체</button>' + Object.keys(CATS).map(function(k){
    return '<button class="chip" data-v="'+k+'">'+CATS[k][0]+' '+CATS[k][1]+'</button>';
  }).join('');
  var cs = cc.querySelectorAll('.chip');
  for(var i=0;i<cs.length;i++)(function(b){
    b.addEventListener('click', function(){
      for(var j=0;j<cs.length;j++) cs[j].classList.remove('active');
      b.classList.add('active'); state.cat=b.getAttribute('data-v'); renderMarkers();
    });
  })(cs[i]);
  var tc = document.getElementById('townChips');
  tc.innerHTML = '<button class="chip active" data-v="all">화천 전체</button>' + TOWNS.map(function(t){
    return '<button class="chip" data-v="'+t+'">'+t+'</button>';
  }).join('');
  var ts = tc.querySelectorAll('.chip');
  for(var k=0;k<ts.length;k++)(function(b){
    b.addEventListener('click', function(){
      for(var j=0;j<ts.length;j++) ts[j].classList.remove('active');
      b.classList.add('active'); state.town=b.getAttribute('data-v'); renderMarkers();
    });
  })(ts[k]);
}
function switchTab(name){
  var bs = document.querySelectorAll('nav.tabs button');
  for(var i=0;i<bs.length;i++) bs[i].classList.toggle('active', bs[i].getAttribute('data-tab')===name);
  document.getElementById('view-map').style.display = name==='map'?'flex':'none';
  document.getElementById('view-list').style.display = name==='list'?'block':'none';
  document.getElementById('view-plan').style.display = name==='plan'?'block':'none';
  if(name==='map'){ map.relayout(); }
  if(name==='list'){ renderList(); }
}
var tbs = document.querySelectorAll('nav.tabs button');
for(var ti=0;ti<tbs.length;ti++)(function(b){
  b.addEventListener('click', function(){ switchTab(b.getAttribute('data-tab')); });
})(tbs[ti]);
document.getElementById('q').addEventListener('input', function(e){ state.q=e.target.value; renderMarkers(); });
document.getElementById('nearBtn').addEventListener('click', function(e){
  state.near=!state.near;
  e.target.classList.toggle('active', state.near);
  renderMarkers();
});

buildChips();
renderPlan();
renderMarkers();
})();
</script>
